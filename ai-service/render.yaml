services:
  - type: web
    name: nutriai-aiservice
    runtime: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt && pip install google-genai
    startCommand: python run.py
    envVars:
      - key: AI_MODE
        value: production
      - key: VISION_PROVIDER
        value: gemini
      - key: LLM_PROVIDER
        value: gemini
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO